apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web-backend-secret
  namespace: web-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: web-backend-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: shoong/web-backend
